<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Star Reach</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div id="app"></div>

    <!-- Auth overlay: PixiJS has no native text input, so the callsign form is plain HTML layered above the canvas. -->
    <div id="auth-overlay">
      <div class="auth-card">
        <input
          id="callsign-input"
          type="text"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          maxlength="20"
          placeholder="callsign"
        />
        <button id="launch-button" type="button">LAUNCH</button>
        <p id="auth-status"></p>
      </div>
    </div>

    <script type="module" src="/js/main.js"></script>
  </body>
</html>
